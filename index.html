<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día Mamá 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #e6b3cc;
  overflow-x: hidden;
}

/* CONTENEDOR */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 50px;
  min-height: 100vh;
  padding: 20px;
  flex-wrap: wrap;
  position: relative;
  z-index: 2;
}

/* SOBRE */
.envelope {
  width: 300px;
  height: 200px;
  background: #ffe6f0;
  border: 2px solid #ff4d88;
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: transform 0.3s;
}

.envelope:hover {
  transform: scale(1.05);
}

.flap {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #ffb3cc;
  clip-path: polygon(0 0, 100% 0, 50% 60%);
  transition: transform 0.6s;
  transform-origin: top;
}

.texto-sobre {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 70%;
  font-weight: bold;
  color: #ff4d88;
}

.open .flap {
  transform: rotateX(180deg);
}

/* CARTA */
.card {
  width: 350px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  display: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  text-align: center;
}

.card h2 {
  color: #ff4d88;
}

.card img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
  transition: opacity 0.5s;
}

/* CORAZONES LLUVIA */
.heart-rain {
  position: fixed;
  top: -10px;
  font-size: 20px;
  animation: fall linear infinite;
  z-index: 1;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

/* RESPONSIVO */
@media (max-width: 600px) {
  .container {
    flex-direction: column;
  }

  .card {
    width: 90%;
  }
}
</style>

</head>
<body>

<div class="container">

  <!-- SOBRE -->
  <div class="envelope" id="envelope" onclick="abrir()">
    <div class="flap"></div>
    <div class="texto-sobre">Para Mamá 💖</div>
  </div>

  <!-- CARTA -->
  <div class="card" id="card" onclick="cambiarImagen()">
    <h2>💖 Feliz Día Mamá 💖</h2>
    <p>
      Mamá, gracias por todo lo que haces por mí.<br>
      Te amo muchísimo 💕
    </p>

    <img id="imagen" src="foto1.jpg">
  </div>

</div>

<script>
/* ABRIR SOBRE */
function abrir() {
  const sobre = document.getElementById("envelope");
  const carta = document.getElementById("card");

  sobre.classList.toggle("open");

  if (carta.style.display === "block") {
    carta.style.display = "none";
  } else {
    setTimeout(() => {
      carta.style.display = "block";
    }, 400);
  }
}

/* CARRUSEL DE IMÁGENES */
const imagenes = [
  "mf2.jpeg",
  "mf3.jpeg",
  "mf4.jpeg",
  "mf5.jpeg",
  "mf6.jpeg",
  "mf7.jpeg",
  "mf8.jpeg"
];

let index = 0;

function cambiarImagen() {
  const img = document.getElementById("imagen");

  img.style.opacity = 0;

  setTimeout(() => {
    index = (index + 1) % imagenes.length;
    img.src = imagenes[index];
    img.style.opacity = 1;
  }, 300);
}

/* LLUVIA DE CORAZONES (optimizada) */
function crearCorazon() {
  const heart = document.createElement("div");
  heart.classList.add("heart-rain");

  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
  heart.style.fontSize = (Math.random() * 15 + 15) + "px";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

/* CONTROL PARA QUE NO SE BUGUEE */
setInterval(crearCorazon, 300);
</script>

</body>
</html>
